name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Build Deployment Assets
        run: |
          # 1. Resolve domain(s) cleanly from vars
          RAW_DOMAINS="${{ vars.DOMAINS || vars.DOMAIN || secrets.DOMAIN || vars.WORKER_DOMAIN || secrets.WORKER_DOMAIN || vars.IMAGE_DOMAIN || secrets.IMAGE_DOMAIN }}"
          if [ -z "$RAW_DOMAINS" ]; then
            echo "Error: DOMAIN variable is required (e.g. image.example.com or image.example.com, tinge.example.com)"
            exit 1
          fi

          # Parse multiple domains (comma or space separated)
          CLEAN_DOMAINS=()
          for d in $(echo "$RAW_DOMAINS" | tr ',' ' '); do
            cdomain=$(echo "$d" | sed -e 's|^https\?://||' -e 's|/.*$||' | xargs)
            if [ -n "$cdomain" ]; then
              CLEAN_DOMAINS+=("$cdomain")
            fi
          done

          PRIMARY_DOMAIN="${CLEAN_DOMAINS[0]}"
          
          GH_USER="${{ vars.GH_USER || secrets.GH_USER || github.repository_owner }}"
          GH_REPO="${{ vars.GH_REPO || secrets.GH_REPO || github.event.repository.name }}"
          GH_BRANCH="${{ vars.GH_BRANCH || secrets.GH_BRANCH || 'images' }}"
          WORKER_NAME="${{ vars.WORKER_NAME || 'tinge' }}"
          IMAGE_ASSETS_NAME="${{ vars.IMAGE_ASSETS_NAME || 'tinge-assets' }}"

          R2_BUCKET="${{ vars.R2_BUCKET || secrets.R2_BUCKET }}"

          # 2. Ensure public directory exists
          mkdir -p public/fonts

          # 3. Generate wrangler.toml cleanly
          {
            echo "name = \"$WORKER_NAME\""
            echo "main = \"src/index.ts\""
            echo "compatibility_date = \"2024-03-24\""
            echo ""
            for d in "${CLEAN_DOMAINS[@]}"; do
              echo "[[routes]]"
              echo "pattern = \"$d\""
              echo "custom_domain = true"
              echo ""
            done
            echo "[[services]]"
            echo "binding = \"IMAGE_ASSETS\""
            echo "service = \"$IMAGE_ASSETS_NAME\""
            echo ""
            echo "[vars]"
            echo "GH_USER = \"$GH_USER\""
            echo "GH_REPO = \"$GH_REPO\""
            echo "GH_BRANCH = \"$GH_BRANCH\""
            echo "DOMAIN = \"https://$PRIMARY_DOMAIN\""
            echo "IMAGE_DOMAIN = \"https://$PRIMARY_DOMAIN\""
            echo "WORKER_DOMAIN = \"$PRIMARY_DOMAIN\""
            echo ""
            if [ -n "$R2_BUCKET" ]; then
              echo "[[r2_buckets]]"
              echo "binding = \"R2\""
              echo "bucket_name = \"$R2_BUCKET\""
              echo ""
            fi
            echo "[assets]"
            echo "directory = \"./public\""
            echo ""
            echo "[[rules]]"
            echo "type = \"CompiledWasm\""
            echo "globs = [\"**/*.wasm\"]"
            echo "fallbacks = []"
            echo "fallthrough = true"
          } > wrangler.toml

          # 4. Generate Surge module in public/
          {
            echo "#!name=Tinge Auth"
            echo "#!desc=自动注入 Tinge API 验证所需的 Authorization Header"
            echo "#!category=Tinge"
            echo "#!arguments=Auth:鉴权Token"
            echo ""
            echo "[Header Rewrite]"
            for d in "${CLEAN_DOMAINS[@]}"; do
              escaped_d=$(echo "$d" | sed 's/\./\\./g')
              echo "^https?://$escaped_d/api/ header-add Authorization \"Bearer {{{Auth}}}\""
            done
            echo ""
            echo "[MITM]"
            MITM_HOSTS=$(echo "${CLEAN_DOMAINS[*]}" | sed 's/ /, /g')
            echo "hostname = %APPEND% $MITM_HOSTS"
          } > public/surge.sgmodule

          # 5. Prepare local assets
          cp src/assets/style.css public/style.css
          cp src/assets/favicon.* public/ 2>/dev/null || true
          cp node_modules/@fontsource/noto-sans-sc/files/* public/fonts/
          cp node_modules/@fontsource/noto-serif-sc/files/* public/fonts/
          
          # Combine CSS and fix paths
          cat node_modules/@fontsource/noto-sans-sc/index.css > public/fonts.css
          cat node_modules/@fontsource/noto-serif-sc/index.css >> public/fonts.css
          sed -i 's|\./files/|/fonts/|g' public/fonts.css

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          secrets: |
            GH_TOKEN
            AUTH_TOKEN
        env:
            GH_TOKEN: ${{ secrets.GH_TOKEN }}
            AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
